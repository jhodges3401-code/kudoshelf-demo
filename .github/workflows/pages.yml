name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Render share images (SVG -> 1200x630 PNG)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin fonts-inter
          find . -path ./node_modules -prune -o -name 'og.svg' -print | while read f; do rsvg-convert -w 1200 -h 630 "$f" -o "${f%.svg}.png"; done
          find . -name 'og.png' -exec ls -la {} \;
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/
      - run: mkdir _site && cp index.html collect.html admin.html kudoshelf.js testimonials.json senja-alternative.html testimonial-to-alternative.html famewall-alternative.html sitemap.xml _site/ && cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
